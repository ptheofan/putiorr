name: CI

# Validates pull requests before they merge. Pushes to main/master are handled
# by main-container.yml (which runs the same gates before publishing the :main
# image), so CI does not also run on push to avoid duplicating lint + tests.
on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests with coverage
        run: pnpm test:coverage
